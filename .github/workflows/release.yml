name: Create Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v1.2.3, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Create release package
        run: |
          mkdir -p release
          cp manifest.json release/
          cp -r dist release/
          cd release
          zip -r ../variables2json-${{ github.ref_name }}.zip manifest.json dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: variables2json-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: variables2json-${{ github.ref_name }}
          path: variables2json-${{ github.ref_name }}.zip
          retention-days: 90
